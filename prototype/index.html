<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>柠檬记账 · 高保真可交互原型 v1.0</title>
<style>
:root{
  --brand:#FFD946; --brand-track:#FFFBD7;
  --t1:#1A1A1A; --t2:#333333; --t3:#6B6B6B; --t4:#8F8F8F; --dis:#C8C8C8;
  --surface:#FFFFFF; --subtle:#F5F5F5; --note:#ECF0F3;
  --divstrong:#D7D7D7; --divlight:#F0F0F0;
  --grid:#E6E6E6; --axis:#BCBCBC; --line:#4A4A4A; --red:#F5222D;
  --ink:#363233;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
     background:#eef1f5;color:var(--t2);display:flex;align-items:center;justify-content:center;min-height:100vh}
body.shot{background:#fff;display:block;min-height:0}
.phone{position:relative;width:390px;height:844px;background:#fff;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.18);border-radius:26px}
body.shot .phone{box-shadow:none;border-radius:0}

.screen{position:absolute;inset:0;display:none;flex-direction:column;background:#fff}
.screen.active{display:flex}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{width:0}

/* ---------- status bar ---------- */
.statusbar{height:26px;background:var(--brand);color:var(--ink);display:flex;align-items:center;
  justify-content:space-between;padding:0 16px;font-size:12px;font-weight:600;flex:0 0 auto}
.statusbar .sb-r{display:flex;gap:4px;align-items:center}
.sb-bar{width:16px;height:9px;border:1.2px solid var(--ink);border-radius:2px;position:relative}
.sb-bar:after{content:"";position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:10px;background:var(--ink);border-radius:1px}

/* ---------- header ---------- */
.header{height:48px;background:var(--brand);display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;flex:0 0 auto;color:var(--t1)}
.header .h-title{font-size:20px;font-weight:700}
.ic{width:24px;height:24px;display:block}
.ic-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:0;background:none;padding:0;cursor:pointer}
.ic-btn:active{opacity:.5}

/* ---------- 明细 ---------- */
.sum-row{background:var(--brand);display:grid;grid-template-columns:104px 1fr 1fr 34px;align-items:center;padding:4px 16px 0;flex:0 0 auto}
.sum-row .yr{font-size:13px;color:var(--t2)}
.sum-row .lab{font-size:14px;color:var(--t2)}
.big-row{background:var(--brand);display:grid;grid-template-columns:104px 1fr 1fr 34px;align-items:center;padding:2px 16px 12px;flex:0 0 auto}
.month-switch{display:flex;align-items:center;gap:3px;font-size:26px;font-weight:700;color:var(--t1);cursor:pointer}
.big-amt{font-size:20px;font-weight:500;color:var(--t1);text-align:right}
.grid-card{background:#fff;border-radius:12px;margin:8px 16px 4px;display:flex;padding:12px 0;flex:0 0 auto}
.grid-card .g-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;border:0;background:none;padding:0}
.grid-card .g-item:active{opacity:.6}
.grid-card .g-label{font-size:12px;color:var(--t2)}
.day-head{display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 16px;font-size:13px;color:var(--t4)}
.tx-row{display:flex;align-items:center;height:64px;padding:0 16px;cursor:pointer;position:relative}
.tx-row:active{background:#FAFAFA}
.circle{width:40px;height:40px;border-radius:50%;background:var(--subtle);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.circle svg{width:22px;height:22px}
.tx-title{font-size:16px;color:var(--t2);margin-left:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-amt{font-size:16px;font-weight:500;color:var(--t1);margin-left:auto;flex:0 0 auto}
.tx-sep{position:absolute;left:72px;right:0;bottom:0;height:1px;background:var(--divlight)}
.empty{padding:60px 24px;text-align:center;color:var(--t4)}
.empty .e-title{font-size:15px;margin:14px 0 18px}
.btn-y{height:40px;padding:0 22px;border-radius:20px;border:0;background:var(--brand);color:var(--t1);font-size:15px;font-weight:500;cursor:pointer}
.btn-y:active{opacity:.75}

/* ---------- bottom nav ---------- */
.nav{height:58px;background:#fff;display:flex;align-items:flex-start;border-top:1px solid #F2F2F2;flex:0 0 auto;padding-top:6px}
.nav .n-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;
  color:#909090;font-size:11px;cursor:pointer;padding:0}
.nav .n-item.on{color:var(--t2)}
.nav .n-fab{flex:1;display:flex;justify-content:center;align-items:flex-start;border:0;background:none;padding:0;cursor:pointer;position:relative}
.fab{position:absolute;top:-14px;width:56px;height:56px;border-radius:50%;background:var(--brand);
  border:4px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.nav .n-label{font-size:11px;line-height:11px}
.nav-fab-slot{width:56px;height:44px}

/* ---------- 统计 ---------- */
.seg-wrap{padding:10px 16px;background:var(--brand);flex:0 0 auto}
.seg{display:flex;height:44px;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;font-size:15px;color:var(--t1);cursor:pointer;font-family:inherit}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button.on{background:var(--ink);color:#fff;font-weight:500}
.pnav{display:flex;gap:20px;overflow-x:auto;padding:0 16px;height:38px;align-items:center;background:#fff;
  border-bottom:1px solid #F2F2F2;flex:0 0 auto}
.pnav::-webkit-scrollbar{display:none}
.pnav button{border:0;background:none;font-size:13px;color:var(--t4);white-space:nowrap;cursor:pointer;padding:0 0 6px;font-family:inherit}
.pnav button.on{color:var(--t1);font-weight:700;border-bottom:2px solid var(--t1)}
.stat-lines{padding:10px 16px 4px}
.stat-lines div{font-size:14px;color:var(--t3);line-height:24px}
.chart-wrap{position:relative;padding:0 16px}
.chart-title{font-size:18px;font-weight:700;color:var(--t1);padding:14px 16px 6px}
.rank-row{display:flex;align-items:center;height:72px;padding:0 16px}
.rank-main{flex:1;margin-left:16px;min-width:0}
.rank-top{display:flex;align-items:baseline;gap:8px}
.rank-name{font-size:16px;color:var(--t2);white-space:nowrap}
.rank-pct{font-size:13px;color:var(--t4)}
.rank-amt{font-size:16px;font-weight:500;color:var(--t1);flex:0 0 auto;margin-left:8px}
.bar{height:6px;border-radius:3px;background:var(--brand-track);margin-top:6px;overflow:hidden}
.bar i{display:block;height:6px;border-radius:3px;background:var(--brand);min-width:4px}

/* ---------- 记账 ---------- */
.tabs{background:var(--brand);display:flex;align-items:flex-end;height:46px;flex:0 0 auto;padding-bottom:6px}
.tabs .tab{flex:1;text-align:center;font-size:17px;color:var(--ink);position:relative;cursor:pointer;padding-bottom:6px}
.tabs .tab.on{font-weight:700}
.tabs .tab.on:after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:44px;height:2.5px;background:var(--ink);border-radius:2px}
.tabs .cancel{flex:0 0 64px;text-align:center;font-size:16px;color:var(--ink);cursor:pointer;padding-bottom:6px}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);padding:14px 6px 4px;row-gap:14px}
.cat{display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:none;cursor:pointer;padding:0;font-family:inherit}
.cat .c-circle{width:48px;height:48px;border-radius:50%;background:var(--subtle);display:flex;align-items:center;justify-content:center}
.cat .c-circle svg{width:24px;height:24px}
.cat.on .c-circle{background:var(--brand)}
.cat .c-name{font-size:13px;color:var(--t1);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt-show{text-align:right;font-size:36px;font-weight:300;color:var(--t1);padding:8px 16px;min-height:56px;line-height:44px}
.note-row{height:48px;margin:0 16px;border-radius:8px;background:var(--note);display:flex;align-items:center;
  padding:0 12px;font-size:14px;cursor:pointer;gap:16px}
.note-row .n-lab{color:var(--t2);flex:0 0 auto}
.note-row .n-val{color:var(--t4);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.note-row .n-val.filled{color:var(--t2)}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,56px);margin-top:10px;flex:0 0 auto}
.keypad button{border:0;border-top:1px solid var(--divstrong);border-left:1px solid var(--divstrong);
  background:#fff;font-size:20px;color:var(--t1);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px}
.keypad button:nth-child(4n+1){border-left:0}
.keypad button:active{background:var(--subtle)}
.keypad button.op{font-size:22px}
.keypad button.done{background:var(--brand);font-weight:500}
.keypad button.today{font-size:15px;gap:5px}
.keypad button.today svg{width:18px;height:18px}

/* ---------- 我的 / 发现 ---------- */
.card{background:#fff;border-radius:12px;margin:12px 16px;overflow:hidden}
.mrow{display:flex;align-items:center;height:56px;padding:0 16px;cursor:pointer;gap:12px;font-size:16px;color:var(--t2);position:relative}
.mrow:active{background:#FAFAFA}
.mrow+.mrow:before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--divlight)}
.mrow .m-val{color:var(--t4);font-size:14px;margin-left:auto}
.mrow .ic{width:22px;height:22px}
.sec-title{font-size:13px;color:var(--t4);padding:18px 16px 4px}

/* ---------- sheet / toast ---------- */
.mask{position:absolute;inset:0;background:rgba(0,0,0,.35);display:none;z-index:40}
.mask.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;z-index:41;
  transform:translateY(102%);transition:transform .22s ease;max-height:78%;display:flex;flex-direction:column}
.sheet.on{transform:translateY(0)}
.sheet h4{margin:0;padding:16px;font-size:16px;color:var(--t1);border-bottom:1px solid var(--divlight)}
.sheet .s-body{overflow-y:auto;padding:8px 0 16px}
.sheet .s-body::-webkit-scrollbar{width:0}
.srow{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-size:15px;color:var(--t2);cursor:pointer}
.srow:active{background:#FAFAFA}
.srow .s-k{color:var(--t4)}
.form{padding:12px 16px}
.form input{width:100%;height:44px;border:1px solid var(--divstrong);border-radius:8px;padding:0 12px;font-size:16px;font-family:inherit;color:var(--t1);outline:none}
.form input:focus{border-color:var(--brand)}
.form .f-actions{display:flex;gap:12px;margin-top:14px}
.form .f-actions button{flex:1;height:42px;border-radius:21px;border:0;font-size:15px;cursor:pointer;font-family:inherit}
.form .f-actions .ok{background:var(--brand);color:var(--t1);font-weight:500}
.form .f-actions .no{background:var(--subtle);color:var(--t2)}
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 16px}
.months button{height:40px;border:0;border-radius:8px;background:var(--subtle);font-size:15px;cursor:pointer;font-family:inherit;color:var(--t2)}
.months button.on{background:var(--brand);font-weight:600}
.years{display:flex;gap:8px;padding:8px 16px 0}
.years button{flex:1;height:38px;border:0;border-radius:8px;background:var(--subtle);font-size:15px;cursor:pointer;font-family:inherit}
.years button.on{background:var(--brand);font-weight:600}
.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,10px);background:rgba(40,40,40,.92);color:#fff;
  font-size:13px;padding:10px 16px;border-radius:8px;z-index:60;opacity:0;transition:.22s;pointer-events:none;max-width:300px;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast .undo{color:var(--brand);margin-left:8px;cursor:pointer;pointer-events:auto;text-decoration:underline}
.pill{display:inline-block;background:var(--brand);color:var(--t1);border-radius:10px;font-size:11px;padding:2px 8px;margin-left:8px}

/* ---------- page toolbar (non-shot only) ---------- */
.toolbar{position:fixed;top:18px;left:18px;display:flex;flex-direction:column;gap:8px;z-index:100}
body.shot .toolbar{display:none}
.toolbar button{padding:8px 14px;border-radius:8px;border:1px solid #cfd6de;background:#fff;font-size:13px;cursor:pointer;font-family:inherit;text-align:left}
.toolbar button.on{background:var(--brand);border-color:var(--ink);font-weight:600}
.toolbar .tb-note{font-size:12px;color:#6b7280;max-width:190px;line-height:1.5;margin-top:4px}
</style>
</head>
<body>
<div class="toolbar" id="toolbar">
  <button data-go="list">1 明细首页</button>
  <button data-go="chart">2 图表统计</button>
  <button data-go="entry">3 记账</button>
  <button data-go="discover">4 发现</button>
  <button data-go="mine">5 我的</button>
  <div class="tb-note">柠檬记账 v1.0 高保真原型<br>可直接点击手机内元素交互</div>
</div>

<div class="phone" id="phone">
  <section class="screen" id="s-list"></section>
  <section class="screen" id="s-chart"></section>
  <section class="screen" id="s-entry"></section>
  <section class="screen" id="s-discover"></section>
  <section class="screen" id="s-mine"></section>
  <div class="mask" id="mask"></div>
  <div class="sheet" id="sheet"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* =====================================================================

  carrot:`<path d="M4 20c0-9 7-16 16-16 0 9-7 16-16 16z"/><path d="M4 20 14 10"/>`,

  cupcake:`<path d="M5 12h14l-1.6 8H6.6L5 12z"/><path d="M7.5 12a4.5 4.5 0 0 1 9 0"/><path d="M12 4.5v1.5"/>`,

  baby:`<circle cx="12" cy="12.5" r="7.5"/><path d="M9.5 11.5h.01M14.5 11.5h.01"/><path d="M9.5 15.5a3.5 3.5 0 0 0 5 0"/><path d="M12 5V3"/>`,

  plane:`<path d="M12 2c.8 0 1.4.7 1.4 1.6v5.2l6.6 3.9v1.8l-6.6-2v4.3l2 1.5v1.5L12 19l-3.4 1.2v-1.5l2-1.5v-4.3l-6.6 2v-1.8l6.6-3.9V3.6C10.6 2.7 11.2 2 12 2z" fill="currentColor" stroke="none"/>`,
  car:`<path d="M5 16h14v-3l-1.5-4.6A2 2 0 0 0 15.6 7H8.4a2 2 0 0 0-1.9 1.4L5 13v3z"/><path d="M5 13h14"/><circle cx="8" cy="17.4" r="1.6"/><circle cx="16" cy="17.4" r="1.6"/>`,

  search:`<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.2 4.2"/>`,

  eyeOff:`<path d="M3 3l18 18"/><path d="M10.6 6.1A10 10 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3.2 3.7"/><path d="M6.3 7.9A17 17 0 0 0 2 12s3.6 6 10 6a10 10 0 0 0 4.1-.9"/><path d="M9.6 10.4a3 3 0 0 0 4.2 4.2"/>`,

  list:`<rect x="4" y="4.5" width="16" height="15" rx="2.5"/><path d="M8 9.5h8M8 13h8M8 16.5h4"/>`,
  chevronDown:`<path d="M6 9.5l6 6 6-6"/>`,
  image:`<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M4 17.5l5-4.2 3 2.6 3.5-3.4L20 17"/>`,
  tag:`<path d="M11 3H5.5A2.5 2.5 0 0 0 3 5.5V11l10 10 8-8L11 3z"/><circle cx="7.6" cy="7.6" r="1.2"/>`,
  backspace:`<path d="M9 5h10.5a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9L3 12z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/>`,
  plus:`<path d="M12 5v14M5 12h14"/>`,
  minus:`<path d="M5 12h14"/>`,

/* ---------------- 日期与金额工具（纯函数，对应 core:date / core:money） ---------------- */
const MS = 86400000;
const D2E = (s)=>{ const [y,m,d]=s.split('-').map(Number); return Math.round(Date.UTC(y,m-1,d)/MS); };
const E2D = (e)=>{ const t=new Date(e*MS); return t.getUTCFullYear()+'-'+String(t.getUTCMonth()+1).padStart(2,'0')+'-'+String(t.getUTCDate()).padStart(2,'0'); };
const WD = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const weekday = (s)=> WD[new Date(D2E(s)*MS).getUTCDay()];
const ymd = (s)=>{ const [y,m,d]=s.split('-'); return {y:+y,m:+m,d:+d}; };

function isoWeek(epochDay){
  const dow = (new Date(epochDay*MS).getUTCDay()+6)%7;   // 周一=0
  const thu = epochDay - dow + 3;
  const y = new Date(thu*MS).getUTCFullYear();
  const jan1 = Math.round(Date.UTC(y,0,1)/MS);
  return {week: Math.floor((thu-jan1)/7)+1, year:y};
}
/* 无千分位，与参考图一致 */
const fmt2 = (c)=> (c/100).toFixed(2);
const fmtRow = (c)=> (c%100===0) ? String(c/100) : (c/100).toFixed(2);
const sign = (c)=> (c/100).toFixed(2);
const HIDE = '****';

/* ---------------- 周期计算（对应 core:date） ---------------- */
function period(dim, anchorStr){
  const e = D2E(anchorStr);
  const dt = new Date(e*MS);
  const y = dt.getUTCFullYear(), m = dt.getUTCMonth();
  if(dim==='WEEK'){
    const dowMon = (dt.getUTCDay()+6)%7;
    const start = e - dowMon, end = start + 6;
    const iw = isoWeek(start);
    return {dim,start,end,label:iw.week+'周',week:iw.week};
  }
  if(dim==='MONTH'){
    const start = Math.round(Date.UTC(y,m,1)/MS);
    const end = Math.round(Date.UTC(y,m+1,1)/MS)-1;
    return {dim,start,end,label:(m+1)+'月'};
  }
  const start = Math.round(Date.UTC(y,0,1)/MS), end = Math.round(Date.UTC(y+1,0,1)/MS)-1;
  return {dim,start,end,label:String(y)};
}
function shiftAnchor(dim, anchorStr, k){
  const e = D2E(anchorStr);
  if(dim==='WEEK') return E2D(e - k*7);
  const dt = new Date(e*MS);
  if(dim==='MONTH') return E2D(Math.round(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth()-k,1)/MS));
  return E2D(Math.round(Date.UTC(dt.getUTCFullYear()-k,0,1)/MS));
}
function elapsedDays(p){
  const t = D2E(TODAY);
  if(p.end < t) return p.end - p.start + 1;
  if(p.start > t) return 0;
  return t - p.start + 1;
}

/* ---------------- 统计（对应 core:stats，纯函数） ---------------- */
const live = ()=> DB.filter(t=>!t.deleted);
function inPeriod(t,p){ const e=D2E(t.date); return e>=p.start && e<=p.end; }
function sumOf(list,type){ return list.filter(t=>t.type===type).reduce((a,t)=>a+t.amtCents,0); }

function statOf(p, type){
  const list = live().filter(t=>inPeriod(t,p));
  const total = sumOf(list,type);
  const ed = elapsedDays(p);
  const avg = ed>0 ? Math.round(total/ed) : 0;
  const n = p.end-p.start+1;
  const daily = new Array(n).fill(0);
  const dailyCnt = new Array(n).fill(0);
  list.forEach(t=>{ if(t.type===type){ const i=D2E(t.date)-p.start; daily[i]+=t.amtCents; dailyCnt[i]++; } });
  const max = Math.max(...daily, 0);
  const rank = {};
  list.filter(t=>t.type===type).forEach(t=>{ rank[t.cat]=(rank[t.cat]||0)+t.amtCents; });
  const ranking = Object.keys(rank).map(k=>({cat:k,amt:rank[k]}))
    .filter(r=>r.amt>0)
    .map(r=>({...r, ratio: total>0 ? r.amt/total : 0, pct: total>0 ? Math.round(r.amt*1000/total)/10 : 0}))
    .sort((a,b)=> b.amt-a.amt || catOrder(a.cat)-catOrder(b.cat));
  return {total, avg, daily, dailyCnt, max, ranking, days:n, elapsed:ed};
}
function allCats(){ return CATS.concat(INCOME_CATS); }
function catOrder(k){ return allCats().findIndex(c=>c.k===k); }
function catName(k){ const c=allCats().find(c=>c.k===k); return c?c.n:k; }

  const cats = e.type==='EXPENSE'? CATS : INCOME_CATS;
  if(!cats.find(c=>c.k===e.cat)) e.cat = cats[0].k;
  const disp = e.cur!=='' ? e.cur : (e.acc!==null ? fmt2(e.acc) : '0.00');
  const dateLabel = e.date===TODAY ? '今天' : e.date.slice(5);

  const grid = cats.map(c=>`<button class="cat ${c.k===e.cat?'on':''}" data-cat="${c.k}">
      <span class="c-circle">${I(c.k)}</span><span class="c-name">${c.n}</span></button>`).join('')
    + `<button class="cat" data-act="morecat"><span class="c-circle">${I('more')}</span><span class="c-name">更多</span></button>`;

  const key = (v,cls='',act='')=>`<button class="${cls}" ${act?`data-key="${act}"`:'data-d="'+v+'"'} >${v}</button>`;
  $('#s-entry').innerHTML = `<div style="display:flex;flex-direction:column;height:100%">
    ${statusbar()}
    <div class="tabs">
      <div class="tab ${e.type==='EXPENSE'?'on':''}" data-type="EXPENSE">支出</div>
      <div class="tab ${e.type==='INCOME'?'on':''}" data-type="INCOME">收入</div>
      <div class="cancel" data-act="cancel">取消</div>
    </div>
    <div class="scroll"><div class="cat-grid">${grid}</div></div>
    <div class="amt-show">${disp}</div>
    <div class="note-row" data-act="note">
      <span class="n-lab">备注：</span>
      <span class="n-val ${e.note?'filled':''}">${e.note||'点击填写备注'}</span>
      <button class="ic-btn" data-act="photo" style="pointer-events:auto">${I('image')}</button>
      <button class="ic-btn" data-act="tag" style="pointer-events:auto">${I('tag')}</button>
    </div>
    <div class="keypad">
      <button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button>
      <button class="today" data-act="date">${I('calendar')}${dateLabel}</button>
      <button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button>
      <button class="op" data-key="plus">+</button>
      <button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button>
      <button class="op" data-key="minus">−</button>
      <button data-d=".">.</button><button data-d="0">0</button>
      <button data-key="back">${I('backspace')}</button>
      <button class="done" data-key="done">${e.editId?'保存':'完成'}</button>
    </div>
  </div>`;
}

/* ---------------- 键盘逻辑 ---------------- */
function pressDigit(d){
  const e = state.entry;
  let cur = e.cur;
  if(d==='.'){
    if(cur==='') cur = '0.';
    else if(cur.includes('.')) return;
    else cur += '.';
  } else {
    if(cur.includes('.') && cur.split('.')[1].length>=2) return;   // BR-1.3.2
    if(cur.replace('.','').length>=9) return;                      // BR-1.3.3
    if(cur==='0') cur = d;                                          // BR-1.3.4
    else cur += d;
  }
  e.cur = cur;
}
function valOf(s){ return s===''||s==='.' ? 0 : Math.round(parseFloat(s)*100); }
function pressOp(op){
  const e = state.entry;
  const v = e.cur!=='' ? valOf(e.cur) : (e.acc!==null?e.acc:0);
  e.acc = e.acc===null ? v : (e.op==='plus' ? e.acc+v : e.acc-v);
  e.op = op; e.cur = '';
}
function pressDone(){
  const e = state.entry;
  let total;
  if(e.acc===null) total = valOf(e.cur);
  else total = e.op==='plus' ? e.acc+valOf(e.cur) : e.acc-valOf(e.cur);
  if(total<=0){ toast('请输入金额'); return; }                     // BR-1.6.1
  if(e.editId){
    const t = DB.find(x=>x.id===e.editId);
    t.type=e.type; t.cat=e.cat; t.amtCents=total; t.note=e.note; t.date=e.date;
    toast('已保存修改'); state.screen='list';
    setTimeout(()=>go('list', true), 120);
    return;
  }
  DB.push({id:SEQ++, date:e.date, type:e.type, cat:e.cat, amtCents:total, note:e.note});
  toast('已记账');
  resetEntry(false);
  state.screen='list';
  setTimeout(()=>go('list', true), 120);
}
function resetEntry(keepType){
  const t = keepType!==false ? state.entry.type : 'EXPENSE';
  state.entry = { type:t, cat:(t==='EXPENSE'?CATS[1].k:INCOME_CATS[0].k), amount:'', note:'', date:TODAY, acc:null, op:null, cur:'', editId:null };
}

/* ---------------- 路由 ---------------- */
function go(id, keepScroll){
  state.screen = id;
  ['list','chart','entry','discover','mine'].forEach(k=>{
    const el = $('#s-'+k);
    if(k===id) el.classList.add('active'); else el.classList.remove('active');
  });
  if(id==='list') renderList();
  if(id==='chart') renderChart();
  if(id==='entry') renderEntry();
  if(id==='discover') renderDiscover();
  if(id==='mine') renderMine();
  document.querySelectorAll('#toolbar button').forEach(b=>b.classList.toggle('on', b.dataset.go===id));
  if(location.hash.slice(1)!==id) history.replaceState(null,'','#'+id);
}

/* ---------------- 事件（事件委托） ---------------- */
document.addEventListener('click', (ev)=>{
  const t = ev.target.closest('[data-go],[data-act],[data-dim],[data-period],[data-pt],[data-tx],[data-cat],[data-d],[data-key],[data-mact],[data-type],[data-keyboard]');
  if(!t) return;
  if(t.dataset.keyboard) return;

  if(t.dataset.go){ if(t.dataset.go==='entry') resetEntry(true); go(t.dataset.go); return; }

  if(t.dataset.d){
    const d = t.dataset.d;
    state.entry.cur = state.entry.cur || '';
    const before = state.entry.cur;
    pressDigit(d);
    if(state.entry.cur!==before) renderEntry();
    return;
  }
  if(t.dataset.key){
    const k = t.dataset.key;
    if(k==='done'){ pressDone(); return; }
    if(k==='back'){
      const e = state.entry;
      if(e.cur!==''){ e.cur = e.cur.slice(0,-1); if(e.cur==='') e.cur=''; renderEntry(); }
      else if(e.acc!==null){ e.acc=null; e.op=null; renderEntry(); }
      return;
    }
    pressOp(k);
    renderEntry();
    return;
  }
  if(t.dataset.type){
    const nt = t.dataset.type;
    if(nt!==state.entry.type){
      state.entry.type = nt;
      state.entry.cat = (nt==='EXPENSE'?CATS[1].k:INCOME_CATS[0].k);
      renderEntry();
    }
    return;
  }
  if(t.dataset.cat){ state.entry.cat = t.dataset.cat; renderEntry(); return; }

  if(t.dataset.dim){ state.chartDim = t.dataset.dim; state.chartAnchor = TODAY; state.chartPoint=null; renderChart(); return; }
  if(t.dataset.period){ state.chartAnchor = t.dataset.period; state.chartPoint=null; renderChart(); return; }
  if(t.dataset.pt){ state.chartPoint = +t.dataset.pt; renderChart(); return; }

  if(t.dataset.tx){ showTxSheet(+t.dataset.tx); return; }

  if(t.dataset.mact){ doMineAct(t.dataset.mact); return; }

  const act = t.dataset.act;
  if(act==='eye'){ state.hideAmount = !state.hideAmount; renderList(); return; }
  if(act==='month'){ openMonthPicker(); return; }
  if(act==='today'){ state.month = TODAY.slice(0,7); renderList(); toast('已定位到 '+TODAY); return; }
  if(act==='search'){ openSearch(); return; }
  if(act==='soon'){ toast('该功能将在后续版本提供'); return; }
  if(act==='ctype'){ state.chartType = state.chartType==='EXPENSE'?'INCOME':'EXPENSE'; state.chartPoint=null; renderChart(); return; }
  if(act==='cmode'){ toast('饼图视图将在 v1.1 提供'); return; }
  if(act==='cancel'){ resetEntry(true); go('list'); return; }
  if(act==='morecat'){ toast('分类管理见「我的 → 分类管理」'); return; }
  if(act==='photo'){ ev.stopPropagation(); toast('原型演示：真实实现将打开相册/相机'); return; }
  if(act==='tag'){ ev.stopPropagation(); openTagPicker(); return; }
  if(act==='note'){ openNoteEditor(); return; }
  if(act==='date'){ openDatePicker(); return; }
});

function openDatePicker(){
  const base = D2E(TODAY); let html='';
  for(let k=0;k<45;k++){
    const d = E2D(base-k);
    html += `<div class="srow" data-pick="${d}" ${d===state.entry.date?'style="background:#FFF9E0"':''}>
      <span>${d}</span><span class="s-k">${k===0?'今天':weekday(d)}</span></div>`;
  }
  openSheet(`<h4>选择日期</h4><div class="s-body">${html}</div>`);
}
function openTagPicker(){
  openSheet(`<h4>选择标签（最多 5 个）</h4><div class="s-body">

function openMonthPicker(){

  for(let i=1;i<=12;i++) html += `<button class="${i===m?'on':''}" data-month="${i}">${i}月</button>`;

/* 弹层内的二次交互 */
document.addEventListener('click', (ev)=>{
  const el = ev.target.closest('[data-sheet],[data-pick],[data-tagpick],[data-year],[data-month],[data-edit],[data-del],[data-bk],[data-rs],[data-ws]');
  if(!el) return;
  if(el.dataset.sheet==='close'){ closeSheet(); return; }
  if(el.dataset.sheet==='savenote'){
    const v = ($('#noteInput').value||'').slice(0,50);
    state.entry.note = v; closeSheet(); renderEntry(); return;
  }
  if(el.dataset.pick){ state.entry.date = el.dataset.pick; closeSheet(); renderEntry(); return; }
  if(el.dataset.tagpick){
    if(el.dataset.tagpick==='__new') toast('原型演示：新建标签');
    else toast('已添加标签「'+el.dataset.tagpick+'」');
    closeSheet(); return;
  }
  if(el.dataset.year){ const m=state.month.split('-')[1]; state.month = el.dataset.year+'-'+m; closeSheet(); renderList(); return; }
  if(el.dataset.month){ const y=state.month.split('-')[0]; state.month = y+'-'+String(el.dataset.month).padStart(2,'0'); closeSheet(); renderList(); return; }
  if(el.dataset.edit){
    const t = DB.find(x=>x.id===+el.dataset.edit);
    state.entry = {type:t.type, cat:t.cat, note:t.note, date:t.date, acc:null, op:null, cur:(t.amtCents/100).toFixed(2), editId:t.id};
    closeSheet(); go('entry'); return;
  }
  if(el.dataset.del){
    const id = +el.dataset.del, t = DB.find(x=>x.id===id);
    closeSheet();
    if(confirmDelete()){
      t.deleted = true;
      renderList();
      toast('已删除', ()=>{ t.deleted=false; renderList(); toast('已撤销'); });
    }
    return;
  }
  if(el.dataset.bk){
    const n = {backup:'LemonLedger-backup-20261009-2155.json', csv:'LemonLedger-2026-10.csv', xlsx:'LemonLedger-2026-10.xlsx'}[el.dataset.bk];
    closeSheet();
    toast('原型演示：将生成 ' + n);
    return;
  }
  if(el.dataset.rs){
    closeSheet();
    if(el.dataset.rs==='bad') toast('备份文件已损坏，无法恢复');
    else toast('已' + (el.dataset.rs==='overwrite'?'覆盖':'合并') + '恢复（原型演示）');
    return;
  }
  if(el.dataset.ws){ state.weekStartMon = el.dataset.ws==='MON'; closeSheet(); renderMine(); toast('每周起始日已设为' + (state.weekStartMon?'周一':'周日')); return; }
});
function confirmDelete(){
  return window.confirm('确认删除这条流水？删除后 3 秒内可撤销。');
}

/* ---------------- 启动 ---------------- */
const init = ()=>{
  const q = new URLSearchParams(location.search);
  if(q.get('shot')==='1') document.body.classList.add('shot');
  const hash = location.hash.slice(1);
  const valid = ['list','chart','entry','discover','mine'];
  go(valid.includes(hash) ? hash : (q.get('screen')||'list'));
};
window.addEventListener('hashchange', ()=>{
  const h = location.hash.slice(1);
  if(['list','chart','entry','discover','mine'].includes(h) && h!==state.screen) go(h);
});
init();
